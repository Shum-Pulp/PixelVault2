<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donkey Kong: Barrel Climb</title>
    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
</head>
<body>
    <main class="game-wrap">
        <div class="game-heading">
            <div>
                <p>PIXEL VAULT ORIGINAL</p>
                <h1>Barrel Climb</h1>
            </div>
            <div class="game-actions">
                <div class="scoreboard" aria-label="Score keeper">
                    <span>Score <strong id="score">0</strong></span>
                    <span>Best <strong id="high-score">0</strong></span>
                </div>
                <button id="new-game" type="button">Start Game</button>
            </div>
        </div>

        <canvas id="game" width="640" height="560" aria-label="Barrel climbing platform game"></canvas>
        <p id="game-status" class="status" aria-live="polite">Reach the top and rescue Pauline.</p>

        <section class="instructions">
            <div>
                <h2>How to play</h2>
                <p>Use <kbd>&larr;</kbd><kbd>&rarr;</kbd> or <kbd>A</kbd><kbd>D</kbd> to move, <kbd>&uarr;</kbd><kbd>&darr;</kbd> or <kbd>W</kbd><kbd>S</kbd> on ladders, and <kbd>Space</kbd> to jump.</p>
            </div>
            <div class="touch-controls" aria-label="Touch controls">
                <button type="button" data-action="left" aria-label="Move left">&larr;</button>
                <button type="button" data-action="down" aria-label="Climb down">&darr;</button>
                <button type="button" data-action="up" aria-label="Climb up">&uarr;</button>
                <button type="button" data-action="right" aria-label="Move right">&rarr;</button>
                <button type="button" data-action="jump" aria-label="Jump">JUMP</button>
            </div>
        </section>
    </main>
</body>
</html>
